name: Deploy to AWS EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build & Deploy to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 1: Setup Node.js and build React frontend
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build Frontend Application
        run: |
          cd frontend
          npm ci
          REACT_APP_BACKEND_URL="" CI=false npm run build

      # Step 2: Transfer built frontend files to EC2 Nginx webroot
      - name: Deploy Frontend to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "frontend/build/*"
          target: "/var/www/charitage"
          strip_components: 2

      # Step 3: Update Backend Code & Restart Systemd Services
      - name: Update Backend & Restart Services
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/charitage
            git pull origin main
            cd backend
            if [ -d "venv" ]; then
              ./venv/bin/pip install -r requirements.txt
            fi
            sudo systemctl restart charitage
            sudo systemctl reload nginx
